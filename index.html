<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CookLog</title>
<meta name="theme-color" content="#1c1f17" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="CookLog" />
<meta name="description" content="Личный дневник рецептов" />
<link rel="icon" type="image/png" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">🍲</span>
      <span class="logo-text">CookLog</span>
    </div>
    <nav class="header-nav">
      <a href="index.html" class="nav-link active">Рецепты</a>
      <button class="nav-link nav-link-shopping" id="shopping-nav-btn">
        🛒 Список
        <span class="shopping-badge" id="shopping-badge">0</span>
      </button>
      <a href="admin.html" class="nav-link nav-admin">+ Добавить</a>
    </nav>
  </div>
</header>

<main class="main">
  <section class="filters-section">
    <div class="filters-row">
      <div class="filter-group">
        <span class="filter-label">Тип блюда</span>
        <div class="filter-chips" id="type-chips">
          <button class="chip active" data-filter="type" data-value="">Все</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Способ готовки</span>
        <div class="filter-chips" id="method-chips">
          <button class="chip active" data-filter="method" data-value="">Все</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">Ингредиенты</span>
        <button class="chip chip-ingredients-toggle" id="ingredients-toggle">
          <span id="ingredients-toggle-label">Все</span> <span class="chip-caret">▾</span>
        </button>
      </div>
      <div class="filter-group filter-search">
        <span class="filter-label">Поиск</span>
        <input type="text" id="search-input" class="search-input" placeholder="Название, ингредиент или тег…" />
      </div>
    </div>
  </section>

  <div class="toolbar-row">
    <div class="recipes-count" id="recipes-count"></div>
    <button class="btn-random" id="random-btn">🎲 Что приготовить?</button>
  </div>

  <section class="recipes-section">
    <div class="recipes-grid" id="recipes-grid"></div>
    <div class="empty-state hidden" id="empty-state">
      <span class="empty-icon">🍽️</span>
      <p>Рецепты не найдены. Попробуй другие фильтры.</p>
    </div>
  </section>
</main>

<!-- ─── Фильтр ингредиентов ─────────────────────────────── -->
<div class="modal-overlay hidden" id="ingredients-overlay" tabindex="-1">
  <div class="modal modal-ingredients" id="ingredients-modal">
    <button class="modal-close" id="ingredients-close">✕</button>
    <div class="modal-content">
      <h3 class="ingredients-title">Ингредиенты</h3>
      <p class="ingredients-hint">Покажем рецепты, где есть все выбранные</p>
      <input type="text" id="ingredients-search" class="search-input ingredients-search" placeholder="Найти ингредиент…" />
      <div class="ingredients-filter-list" id="ingredients-filter-list"></div>
      <div class="ingredients-actions">
        <button class="btn-text" id="ingredients-clear">Сбросить всё</button>
        <button class="btn-primary-small" id="ingredients-apply">Показать рецепты</button>
      </div>
    </div>
  </div>
</div>

<!-- ─── Модалка рецепта ─────────────────────────────────── -->
<div class="modal-overlay hidden" id="modal-overlay" tabindex="-1">
  <div class="modal" id="modal">
    <button class="modal-close" id="modal-close">✕</button>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<!-- ─── Список покупок ─────────────────────────────────── -->
<div class="modal-overlay hidden" id="shopping-overlay" tabindex="-1">
  <div class="modal modal-shopping">
    <button class="modal-close" id="shopping-close">✕</button>
    <div class="modal-content">
      <div class="shopping-header-row">
        <h3 class="shopping-modal-title">🛒 Список покупок</h3>
        <button class="shopping-clear-btn" id="shopping-clear-btn">Очистить всё</button>
      </div>
      <p class="shopping-hint">Добавляй рецепты через кнопку в карточке</p>
      <div class="shopping-add-row">
        <input type="text" id="shopping-add-input" class="search-input" placeholder="Добавить пункт вручную…" />
        <button class="btn-primary-small" id="shopping-add-btn">+ Добавить</button>
      </div>
      <div id="shopping-modal-body"></div>
    </div>
  </div>
</div>

<!-- ─── Режим готовки ──────────────────────────────────── -->
<div id="cooking-overlay" class="hidden" tabindex="-1">
  <div class="cooking-header">
    <div class="cooking-title"></div>
    <button class="cooking-close" id="cooking-close">✕</button>
  </div>
  <div class="cooking-progress-wrap">
    <div class="cooking-progress-bar">
      <div class="cooking-progress-fill" style="width:0%"></div>
    </div>
    <div class="cooking-step-counter"></div>
  </div>
  <div class="cooking-body" id="cooking-body"></div>
  <div class="cooking-nav">
    <button class="btn-cook-prev" id="cook-prev" disabled>← Назад</button>
    <button class="btn-cook-next" id="cook-next">Дальше →</button>
  </div>
</div>

<!-- ─── PWA banner ────────────────────────────────────── -->
<div class="pwa-banner hidden" id="pwa-banner">
  <span class="pwa-banner-icon">📱</span>
  <span class="pwa-banner-text">Установить CookLog на экран</span>
  <button class="pwa-banner-btn" id="pwa-install-btn">Установить</button>
  <button class="pwa-banner-close" id="pwa-banner-close">✕</button>
</div>

<script src="js/a11y.js"></script>
<script src="js/api.js"></script>
<script src="js/recipes.js"></script>
<script src="js/cooking.js"></script>
<script src="js/shopping.js"></script>
<script src="js/modal.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }

  let deferredPrompt;
  const banner = document.getElementById('pwa-banner');
  const installBtn = document.getElementById('pwa-install-btn');
  const closeBtn = document.getElementById('pwa-banner-close');

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(() => banner.classList.remove('hidden'), 3000);
  });

  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    banner.classList.add('hidden');
  });

  closeBtn.addEventListener('click', () => {
    banner.classList.add('hidden');
    localStorage.setItem('pwa-banner-dismissed', '1');
  });

  if (localStorage.getItem('pwa-banner-dismissed')) banner.remove();
  window.addEventListener('appinstalled', () => banner.classList.add('hidden'));
</script>
</body>
</html>
